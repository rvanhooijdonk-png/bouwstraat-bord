name: Bord verversen
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: bord
  cancel-in-progress: false
jobs:
  ververs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.uitrol.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Offline proef van de generator (geen privétekst naar de publieke site)
        run: python3 tests/test_bouw_data.py
      - name: DOM-proef tegels andere borden
        run: node tests/test_borden_dom.mjs
      - name: Gegevens ophalen (alleen lezen)
        env:
          ROUTE2_LEES_TOKEN: ${{ secrets.ROUTE2_LEES_TOKEN }}
        run: |
          mkdir -p site
          cp index.html voorstel.html stack.html publishing.html site/
          python scripts/bouw_data.py > site/data.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - name: Hangende Pages-uitrollen afsluiten
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=5" --jq '.[].sha' | sort -u); do
            [ "$sha" = "${{ github.sha }}" ] && continue
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" --silent || true
          done
      - id: uitrol
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
