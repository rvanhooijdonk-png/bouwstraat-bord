name: Bord verversen
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: bord
  cancel-in-progress: true
jobs:
  ververs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.uitrol.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gegevens ophalen (alleen lezen)
        env:
          ROUTE2_LEES_TOKEN: ${{ secrets.ROUTE2_LEES_TOKEN }}
        run: |
          mkdir -p site
          cp index.html voorstel.html site/
          python scripts/bouw_data.py > site/data.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: uitrol
        uses: actions/deploy-pages@v4
